<title>Widget-Raster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one toolbar row, then a 12-column drag-and-resize grid on a dotted ground.
   Each widget header shows its live grid coordinates (x, y, width x height in cells). */
:root {
  --bg: #eef1f4;
  --dot: #c9d0d8;
  --surface: #ffffff;
  --line: #d5dbe2;
  --fg: #17212b;
  --muted: #5b6875;
  --accent: #0b6e8f;
  --accent-soft: #d9ecf2;
  --good: #1f7a4d;
  --warn: #b4541a;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161c; --dot: #2a3440; --surface: #19222b; --line: #2c3742;
    --fg: #e6ecf1; --muted: #94a2af; --accent: #5cc0de; --accent-soft: #16343f; --good: #5fcf96; --warn: #f0a060;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161c; --dot: #2a3440; --surface: #19222b; --line: #2c3742;
  --fg: #e6ecf1; --muted: #94a2af; --accent: #5cc0de; --accent-soft: #16343f; --good: #5fcf96; --warn: #f0a060;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.top h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 500 14px var(--font-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .w-x:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

.status { font: 400 12px var(--font-mono); color: var(--muted); min-height: 18px; }

.ground {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.5px);
  background-size: 16px 16px;
  border: 1px dashed var(--line); border-radius: 8px;
  padding: 4px; min-height: 200px; min-width: 0;
}

/* widget */
.grid-stack > .grid-stack-item > .grid-stack-item-content {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column; overflow: hidden;
}
.w-head {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--line);
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
}
.grid-stack-static .w-head { cursor: default; }
.w-title { font: 600 13px var(--font-display); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-pos { font: 400 11px var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.w-x { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
.w-x:hover { background: var(--accent-soft); color: var(--fg); }
.grid-stack-static .w-x { display: none; }
.w-body { flex: 1; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

.stat-num { font: 600 34px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat-sub { color: var(--muted); font-size: 13px; }
.stat-delta { color: var(--good); font: 500 12px var(--font-mono); }

.rng { display: flex; gap: 4px; }
.rng-b { font: 500 12px var(--font-body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.rng-b:hover { border-color: var(--accent); }
.rng-b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rng-b[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.spark-wrap { position: relative; flex: 1; min-height: 48px; touch-action: pan-y; cursor: crosshair; }
.spark { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.spark .area { fill: var(--accent-soft); }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.spark .avg { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.mk, .cur-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--surface); transform: translate(-50%, -50%); pointer-events: none; }
.mk.hi { background: var(--good); }
.mk.lo { background: var(--warn); }
.cur-dot { background: var(--accent); }
.cur { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); pointer-events: none; }
.tip { position: absolute; top: 0; font: 500 11px var(--font-mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.cap { color: var(--muted); font-size: 12px; }
.cap b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.cap .k-hi { color: var(--good); }
.cap .k-lo { color: var(--warn); }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tl li { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; }
.flt { display: flex; flex-wrap: wrap; gap: 6px; }
.inp { flex: 1 1 120px; min-width: 0; font: 400 13px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
.inp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sel.sm, .btn.sm { font-size: 12px; padding: 3px 6px; border-radius: 4px; }
.flag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.flag.s-in_progress { color: var(--accent); border-color: var(--accent); }
.flag.s-blocked { color: var(--warn); border-color: var(--warn); }
.zl { color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.zl:hover { text-decoration-color: var(--accent); }
.zl:focus-visible, .cp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note-in { grid-column: 2; font-size: 12px; }
.kc { user-select: all; -webkit-user-select: all; }
.cp { font: 500 11px var(--font-body); color: var(--accent); background: none; border: 0; padding: 0 2px; cursor: pointer; }
.flag.set { color: var(--fg); background: var(--accent-soft); border-color: var(--accent); font-weight: 500; }
.grp { font: 600 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 6px 0 0; }
.pill { font: 500 11px var(--font-mono); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.s-in_progress { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pill.s-blocked { color: var(--warn); border-color: var(--warn); }
.tl .t { min-width: 0; overflow-wrap: anywhere; }
.tl .p { grid-column: 2; font: 400 11px var(--font-mono); color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.st { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.st-text { flex: 1; min-height: 0; overflow: auto; white-space: pre-wrap; font-size: 14px; }
.st-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sel { font: 500 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; max-width: 100%; }
.sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.bars .track { height: 8px; background: var(--accent-soft); border-radius: 2px; min-width: 0; }
.bars .fill { height: 100%; background: var(--accent); border-radius: 2px; }
.bars .val { font: 400 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.note { flex: 1; min-height: 40px; width: 100%; box-sizing: border-box; resize: none;
  font: 400 14px/1.5 var(--font-body); color: var(--fg); background: transparent; border: 0; padding: 0; }

.grid-stack-placeholder > .placeholder-content {
  background-color: var(--accent-soft) !important; border: 1px dashed var(--accent); border-radius: 6px;
}
.fail { padding: 24px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .grid-stack-animate, .grid-stack-animate .grid-stack-item { transition: none !important; }
}

</style>

<div class="page">
  <div class="top">
    <div>
      <h1>Widget-Raster</h1>
      <p>Ziehe ein Widget an seiner Kopfzeile. Ändere die Größe an der Ecke unten rechts. Alle Zahlen sind Beispieldaten. Aufgaben und Status kommen aus der Datenbank dieser Seite.</p>
    </div>
    <div class="tools">
      <select class="sel" id="add-kind" aria-label="Art des neuen Widgets">
        <option value="note">Notiz</option>
        <option value="status">Status zum Anhören</option>
        <option value="todo">Aufgaben</option>
        <option value="sessions">Sitzungen</option>
        <option value="jira">Jira-Tickets</option>
        <option value="spark">Aufrufe pro Tag</option>
        <option value="bars">Aufrufe nach Bereich</option>
        <option value="statA">Aufrufe heute</option>
        <option value="statB">Antwortzeit</option>
      </select>
      <button class="btn primary" id="btn-add" type="button">Widget hinzufügen</button>
      <button class="btn" id="btn-lock" type="button" aria-pressed="false">Raster sperren</button>
      <button class="btn" id="btn-reset" type="button">Anordnung zurücksetzen</button>
    </div>
  </div>
  <div class="status" id="status" role="status"></div>
  <div class="ground"><div class="grid-stack" id="grid"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
<script>
(function () {
  var KEY = 'widget-raster-layout-v3';
  var gridEl = document.getElementById('grid');
  var statusEl = document.getElementById('status');

  if (typeof GridStack === 'undefined') {
    gridEl.innerHTML = '<p class="fail">GridStack wurde nicht geladen. Das Raster kann nicht angezeigt werden.</p>';
    return;
  }

  var DEFAULTS = [
    { id: 'stat-a', kind: 'statA', x: 0, y: 0, w: 3, h: 2 },
    { id: 'stat-b', kind: 'statB', x: 3, y: 0, w: 3, h: 2 },
    { id: 'spark',  kind: 'spark', x: 6, y: 0, w: 6, h: 3 },
    { id: 'todo',   kind: 'todo',  x: 0, y: 2, w: 6, h: 4 },
    { id: 'status', kind: 'status', x: 6, y: 3, w: 6, h: 3 },
    { id: 'bars',   kind: 'bars',  x: 6, y: 6, w: 6, h: 3 },
    { id: 'sessions', kind: 'sessions', x: 0, y: 6, w: 6, h: 4 },
    { id: 'jira', kind: 'jira', x: 6, y: 11, w: 6, h: 5 },
    { id: 'note-0', kind: 'note',  x: 6, y: 9, w: 6, h: 2 }
  ];

  var TITLES = { statA: 'Aufrufe heute', statB: 'Antwortzeit', spark: 'Aufrufe pro Tag', todo: 'Aufgaben (zotero2ai)', status: 'Status zum Anhören', sessions: 'Sitzungen', jira: 'Jira-Tickets', bars: 'Aufrufe nach Bereich', note: 'Notiz' };
  var SIZES = { note: [3, 2], status: [6, 3], todo: [6, 4], sessions: [6, 4], jira: [6, 5], spark: [6, 3], bars: [6, 3], statA: [3, 2], statB: [3, 2] };
  var SERIES = [198, 224, 251, 243, 176, 159, 232, 261, 274, 290, 268, 183, 171, 246, 279, 305, 212, 240, 231, 268, 301, 188, 164, 255, 290, 312, 344, 330, 207, 181];
  var range = 14;

  // One scale for line, average line, markers and hover cursor: x and y in percent of the plot box.
  function sparkModel() {
    var data = SERIES.slice(-range);
    var max = Math.max.apply(null, data), min = Math.min.apply(null, data);
    var avg = Math.round(data.reduce(function (a, b) { return a + b; }, 0) / data.length);
    return {
      data: data, max: max, min: min, avg: avg,
      x: function (i) { return (i / (data.length - 1)) * 100; },
      y: function (v) { return 90 - ((v - min) / (max - min)) * 72; }
    };
  }
  function dayLabel(i, len) {
    var back = len - 1 - i;
    return back === 0 ? 'heute' : back === 1 ? 'gestern' : 'vor ' + back + ' Tagen';
  }

  function sparkHtml() {
    var m = sparkModel();
    var pts = m.data.map(function (v, i) { return m.x(i).toFixed(2) + ',' + m.y(v).toFixed(2); }).join(' ');
    var iHi = m.data.indexOf(m.max), iLo = m.data.indexOf(m.min);
    var ya = m.y(m.avg).toFixed(2);
    return '<div class="rng" role="group" aria-label="Zeitraum">' + [7, 14, 30].map(function (n) {
        return '<button type="button" class="rng-b" data-range="' + n + '" aria-pressed="' + (n === range) + '">' + n + ' Tage</button>';
      }).join('') + '</div>' +
      '<div class="spark-wrap" data-spark>' +
        '<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Aufrufe pro Tag über ' + range + ' Tage: Hoch ' + m.max + ', Tief ' + m.min + ', Schnitt ' + m.avg + '">' +
          '<polygon class="area" points="0,100 ' + pts + ' 100,100"/>' +
          '<polyline class="ln" points="' + pts + '"/>' +
          '<line class="avg" x1="0" x2="100" y1="' + ya + '" y2="' + ya + '"/></svg>' +
        '<span class="mk hi" style="left:' + m.x(iHi).toFixed(2) + '%;top:' + m.y(m.max).toFixed(2) + '%"></span>' +
        '<span class="mk lo" style="left:' + m.x(iLo).toFixed(2) + '%;top:' + m.y(m.min).toFixed(2) + '%"></span>' +
        '<span class="cur" hidden></span><span class="cur-dot" hidden></span><span class="tip" hidden></span>' +
      '</div>' +
      '<div class="cap"><span class="k-hi">●</span> Hoch <b>' + m.max + '</b> · <span class="k-lo">●</span> Tief <b>' + m.min + '</b> · Schnitt <b>' + m.avg + '</b> (gestrichelt)</div>';
  }

  function sparkHover(wrap, clientX) {
    var m = sparkModel(), r = wrap.getBoundingClientRect();
    if (!r.width) return;
    var i = Math.max(0, Math.min(m.data.length - 1, Math.round(((clientX - r.left) / r.width) * (m.data.length - 1))));
    var x = m.x(i), cur = wrap.querySelector('.cur'), dot = wrap.querySelector('.cur-dot'), tip = wrap.querySelector('.tip');
    cur.style.left = x + '%';
    dot.style.left = x + '%'; dot.style.top = m.y(m.data[i]) + '%';
    tip.textContent = dayLabel(i, m.data.length) + ' · ' + m.data[i];
    tip.style.left = x + '%';
    tip.style.transform = x < 25 ? 'translateX(0)' : x > 75 ? 'translateX(-100%)' : 'translateX(-50%)';
    cur.hidden = dot.hidden = tip.hidden = false;
  }
  function sparkLeave(wrap) {
    ['.cur', '.cur-dot', '.tip'].forEach(function (s) { wrap.querySelector(s).hidden = true; });
  }

  function barsHtml() {
    var rows = [['Suche', 412], ['Berichte', 287], ['Export', 164], ['Einstellungen', 58]];
    var max = rows[0][1];
    return '<div class="bars">' + rows.map(function (r) {
      return '<span>' + r[0] + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.round(r[1] / max * 100) + '%"></span></span><span class="val">' + r[1] + '</span>';
    }).join('') + '</div>';
  }

  function bodyHtml(kind, id) {
    switch (kind) {
      case 'statA': return '<div class="stat-num">1.284</div><div class="stat-sub">Seitenaufrufe</div><div class="stat-delta">+8 % zu gestern</div>';
      case 'statB': return '<div class="stat-num">182 ms</div><div class="stat-sub">Median, letzte Stunde</div><div class="stat-delta">−12 ms zu gestern</div>';
      case 'spark': return sparkHtml();
      case 'bars':  return barsHtml();
      case 'todo':   return '<div data-todos>' + todoShell() + '</div>';
      case 'status': return '<div class="st" data-status>' + statusHtml() + '</div>';

    catch (e) { statusEl.textContent = 'Speichern in diesem Browser nicht möglich. Die Anordnung gilt bis zum Neuladen.'; }
  }
  function labels() {
    grid.engine.nodes.forEach(function (n) {
      var el = n.el && n.el.querySelector('[data-pos]');
      if (el) el.textContent = 'x' + n.x + ' y' + n.y + ' · ' + n.w + '×' + n.h;
    });
  }
  function show(items) {
    grid.removeAll();
    kinds = {};
    items.forEach(function (it) { kinds[it.id] = it.kind; });
    grid.load(items.map(toWidget));
    renderData();
    labels();
  }

  var grid = GridStack.init({
    column: 12, cellHeight: 84, margin: 6, float: false, animate: true,
    handle: '.w-head',
    columnOpts: { breakpoints: [{ w: 640, c: 1 }] }
  }, gridEl);

  var saved = readSaved();
  show(saved || DEFAULTS);
  // A saved layout from before the Jira tile gets it once; removing it later keeps it removed.
  try {
    if (saved && !localStorage.getItem('widget-raster-got-jira') && !saved.some(function (s) { return s.kind === 'jira'; })) {
      kinds.jira = 'jira';
      grid.addWidget(toWidget({ id: 'jira', kind: 'jira', w: 6, h: 5 }));
      labels(); renderJira();
    }
    localStorage.setItem('widget-raster-got-jira', '1');
  } catch (e) {}
  statusEl.textContent = saved ? 'Gespeicherte Anordnung aus diesem Browser geladen' : 'Startanordnung · 12 Spalten, Zellenhöhe 84 px';

  initCapabilities();

  gridEl.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.matches('[data-flag]')) setFlag(el.getAttribute('data-flag'), el.value);
    else if (el.matches('[data-note]')) setNote(el.getAttribute('data-note'), el.value);
    else if (el.matches('[data-status-menu]')) { statusSel = el.value; statusNote = ''; renderStatus(); }
    else if (el.matches('select[data-f]')) {
      flt[el.getAttribute('data-f')] = el.value; saveFlt();
      rerenderFor(el.getAttribute('data-f'));
    }
  });
  gridEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-copy]');
    if (!b) return;
    var key = b.getAttribute('data-copy');
    function done(ok) { b.textContent = ok ? 'kopiert' : 'markiert'; setTimeout(function () { b.textContent = 'kopieren'; }, 1500); }
    function selectKey() {
      var kc = b.previousElementSibling, r = document.createRange();
      r.selectNodeContents(kc); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done(false);
    }
    try { navigator.clipboard.writeText(key).then(function () { done(true); }, selectKey); } catch (e) { selectKey(); }
  });
  gridEl.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el.matches('input[data-f]')) return;
    flt[el.getAttribute('data-f')] = el.value; saveFlt();
    rerenderFor(el.getAttribute('data-f'));
  });

  gridEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'noop') return;
    if (act === 'speak') speakStatus();
    else if (act === 'reload') reloadStatus();
    else if (tts) tts.stop().catch(function () {});
  });

  grid.on('change added removed', function () { labels(); persist(); });
  grid.on('drag resize', function () { labels(); });

  gridEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.w-x');
    if (!btn) return;
    var item = btn.closest('.grid-stack-item');
    var id = item.gridstackNode && item.gridstackNode.id;
    grid.removeWidget(item);
    delete kinds[id];
    persist();
  });

  gridEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.rng-b');
    if (!btn) return;
    range = Number(btn.getAttribute('data-range')) || 14;
    btn.closest('.w-body').innerHTML = sparkHtml();
  });
  gridEl.addEventListener('pointermove', function (ev) {
    var wrap = ev.target.closest('[data-spark]');
    if (wrap) sparkHover(wrap, ev.clientX);
  });
  gridEl.addEventListener('pointerdown', function (ev) {
    var wrap = ev.target.closest('[data-spark]');
    if (wrap) sparkHover(wrap, ev.clientX);
  });
  gridEl.addEventListener('pointerout', function (ev) {
    var wrap = ev.target.closest('[data-spark]');
    if (wrap && !(ev.relatedTarget && wrap.contains(ev.relatedTarget))) sparkLeave(wrap);
  });

  document.getElementById('btn-add').addEventListener('click', function () {
    var kind = document.getElementById('add-kind').value;
    if (!TITLES[kind]) kind = 'note';
    var id = kind + '-' + Date.now().toString(36);
    kinds[id] = kind;
    var w = toWidget({ id: id, kind: kind, w: SIZES[kind][0], h: SIZES[kind][1] });
    delete w.x; delete w.y; // GridStack picks the first free place
    grid.addWidget(w);
    labels(); persist();
  });

  var lockBtn = document.getElementById('btn-lock');
  lockBtn.addEventListener('click', function () {
    var locked = lockBtn.getAttribute('aria-pressed') !== 'true';
    grid.setStatic(locked);
    lockBtn.setAttribute('aria-pressed', String(locked));
    lockBtn.textContent = locked ? 'Raster entsperren' : 'Raster sperren';
    statusEl.textContent = locked ? 'Raster gesperrt: Widgets lassen sich nicht verschieben' : 'Raster entsperrt';
  });

  document.getElementById('btn-reset').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    show(DEFAULTS);
    statusEl.textContent = 'Startanordnung wiederhergestellt';
  });
})();
</script>
